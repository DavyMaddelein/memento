<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A3F8F" />
    <title>Memento</title>
    <link rel="preload" href="./composeResources/com.memento.memento_ui_compose.generated.resources/font/noto_sans_jp_regular.ttf" as="fetch" type="font/ttf" crossorigin />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #FBF7F0;
            overflow: hidden;
        }
        #ComposeTarget {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            outline: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #FBF7F0;
            color: #4A3F8F;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(74, 63, 143, 0.2);
            border-top-color: #4A3F8F;
            border-radius: 50%;
            animation: memento-spin 1s linear infinite;
        }
        @keyframes memento-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget" tabindex="0"></canvas>
    <div id="loading" role="status" aria-live="polite">
        <div class="spinner"></div>
        <div>Loading Memento&hellip;</div>
    </div>
    <script src="memento-app-web.js"></script>
</body>
</html>
